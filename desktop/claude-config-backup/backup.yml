---
# =============================================================================
# Claude Code Config Backup → Vault
# =============================================================================
# Backs up ~/.claude.json to Vault at <tree>/anthropic/claude-config-backup as a single
# base64 blob in the `token` field (VAULT-TAXONOMY.md: credentials only, closed vocabulary —
# the file carries API tokens, so it is a credential blob). The mcpServers snapshot and the
# timestamp are NOT stored: mcpServers is derived from the blob on restore, and the backup
# time is the KV v2 version's created_time.
#
# Usage:
#   ansible-playbook desktop/claude-config-backup/backup.yml \
#     -i desktop/claude-config-backup/inventory/hosts.ini
# =============================================================================

- name: Back up Claude Code config to Vault
  hosts: local
  connection: local
  gather_facts: false
  tasks:
    - name: Check Vault availability
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/vault-integration/check.yml"

    - name: Fail if Vault unavailable
      ansible.builtin.fail:
        msg: "Vault is not reachable — cannot store backup."
      when: not (_vault_available | bool)

    - name: Read ~/.claude.json
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.claude.json"
      register: _claude_config_raw
      no_log: true

    - name: Parse config (for the report only)
      ansible.builtin.set_fact:
        _claude_config: "{{ _claude_config_raw.content | b64decode | from_json }}"
      no_log: true

    - name: Store backup in Vault
      ansible.builtin.uri:
        url: "{{ _vault_addr }}/v1/{{ _vault_kv_mount }}/data/{{ _vault_tree }}/anthropic/claude-config-backup"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          data:
            token: "{{ _claude_config_raw.content }}"
        status_code: [200, 204]
        timeout: 10
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: |
          Claude Code config backed up to Vault.

          Path:  {{ _vault_kv_mount }}/{{ _vault_tree }}/anthropic/claude-config-backup
          MCPs:  {{ _claude_config.mcpServers | default({}) | list | join(', ') }}
          Time:  {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
