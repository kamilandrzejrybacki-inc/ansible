---
# =============================================================================
# Forgejo service accounts for machines (migration cutover step)
# =============================================================================
# Usage:
#   ansible-playbook -i dev-tools/forgejo-setup/inventory/hosts.ini dev-tools/forgejo-setup/service-accounts.yml
#
#   argocd          read-only on every org repo   -> Vault forgejo/argocd#token
#                   (ESO -> argocd repo-creds Secret, argocd-apps secrets/eso/argocd)
#   homelab-agents  write on every org repo        -> Vault forgejo/agents#token
#                   (replaces github/cellarette + the deploy keys for cellarette medic
#                   and Hermes: clone/push over the LAN HTTP endpoint)
#
# Tokens are minted once and never printed; delete the Vault leaf to rotate.
# =============================================================================

- name: Load Vault secrets on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check Vault availability
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/vault-integration/check.yml"
    - name: Require Vault
      ansible.builtin.assert:
        that: _vault_available | bool
    - name: Load admin password and any existing tokens
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/vault-integration/load.yml"
      vars:
        vault_refs:
          admin_password: "forgejo/admin#password"
          argocd: "forgejo/argocd#token"
          homelab-agents: "forgejo/agents#token"

- name: Create Forgejo service accounts
  hosts: forgejo
  become: true
  gather_facts: false
  vars:
    _api: "http://{{ forgejo_http_bind }}:{{ forgejo_http_port }}/api/v1"
    _accounts:
      - user: argocd
        team: machines-read
        permission: read
        vault_path: forgejo/argocd
        scopes: read:repository
      - user: homelab-agents
        team: machines-write
        permission: write
        vault_path: forgejo/agents
        scopes: write:repository,read:user,read:organization
  tasks:
    - name: List existing users
      ansible.builtin.command: docker exec {{ forgejo_container_name }} forgejo admin user list
      register: _users
      changed_when: false

    - name: Create the service users (no usable password; tokens only)
      ansible.builtin.command: >-
        docker exec {{ forgejo_container_name }} forgejo admin user create
        --username {{ item.user }} --email {{ item.user }}@{{ domain }}
        --random-password --must-change-password=false
      loop: "{{ _accounts }}"
      when: (' ' ~ item.user ~ ' ') not in (_users.stdout | regex_replace('\\s+', ' '))
      no_log: true

    - name: Ensure one team per permission level covering every org repo
      ansible.builtin.uri:
        url: "{{ _api }}/orgs/{{ forgejo_org }}/teams"
        method: POST
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ hostvars['localhost']._vault_secrets.admin_password | trim }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.team }}"
          permission: "{{ item.permission }}"
          includes_all_repositories: true
          units: [repo.code, repo.pulls, repo.issues, repo.releases, repo.packages, repo.actions]
        status_code: [201, 409, 422]
      loop: "{{ _accounts }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Look up team ids
      ansible.builtin.uri:
        url: "{{ _api }}/orgs/{{ forgejo_org }}/teams/search?q={{ item.team }}"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ hostvars['localhost']._vault_secrets.admin_password | trim }}"
        force_basic_auth: true
      loop: "{{ _accounts }}"
      register: _teams
      delegate_to: localhost
      become: false
      no_log: true

    - name: Add each user to its team
      ansible.builtin.uri:
        url: "{{ _api }}/teams/{{ (item.json.data | selectattr('name', 'equalto', item.item.team) | first).id }}/members/{{ item.item.user }}"
        method: PUT
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ hostvars['localhost']._vault_secrets.admin_password | trim }}"
        force_basic_auth: true
        status_code: 204
      loop: "{{ _teams.results }}"
      loop_control:
        label: "{{ item.item.user }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Mint tokens for accounts that have none in Vault
      ansible.builtin.command: >-
        docker exec {{ forgejo_container_name }} forgejo admin user generate-access-token
        --username {{ item.user }} --token-name {{ item.user }}-{{ lookup('pipe', 'date -u +%Y%m%d%H%M') }}
        --scopes {{ item.scopes }} --raw
      loop: "{{ _accounts }}"
      when: hostvars['localhost']._vault_secrets[item.user] | default('') | length == 0
      register: _tokens
      no_log: true

    - name: Store new tokens in Vault
      ansible.builtin.uri:
        url: "{{ hostvars['localhost']._vault_addr }}/v1/{{ hostvars['localhost']._vault_kv_mount }}/data/homelab/{{ item.item.vault_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ hostvars['localhost']._vault_token }}"
        body_format: json
        body:
          data:
            token: "{{ item.stdout | trim }}"
            username: "{{ item.item.user }}"
        status_code: [200, 204]
      loop: "{{ _tokens.results }}"
      when: item.stdout is defined
      delegate_to: localhost
      become: false
      no_log: true
