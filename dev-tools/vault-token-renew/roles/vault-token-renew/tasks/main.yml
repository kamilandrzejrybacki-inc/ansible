---
# Installs a systemd USER timer (not system-wide): the token belongs to the operator's
# session and lives in their home directory, so root has no business holding it.

- name: Ensure local bin and systemd user directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_env.HOME }}/.local/bin"
    - "{{ ansible_env.HOME }}/.config/systemd/user"

- name: Install the renewal script
  ansible.builtin.template:
    src: vault-token-renew.sh.j2
    dest: "{{ vault_renew_script }}"
    mode: "0700"

- name: Install the systemd user unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - vault-token-renew.service
    - vault-token-renew.timer
  register: vault_renew_units

- name: Reload the user systemd manager
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: vault_renew_units is changed

- name: Enable and start the timer
  ansible.builtin.systemd:
    name: vault-token-renew.timer
    scope: user
    enabled: true
    state: started

# Without this the timer only runs while the operator is logged in — the token would
# then expire during exactly the absences the automation exists to cover.
- name: Allow the user manager to run without an active login session
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
  register: vault_renew_linger
  changed_when: false
  failed_when: false

- name: Run one renewal now so the result is visible immediately
  ansible.builtin.command: "systemctl --user start vault-token-renew.service"
  changed_when: true
