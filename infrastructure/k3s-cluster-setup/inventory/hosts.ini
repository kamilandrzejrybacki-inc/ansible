# k3s cluster inventory.
#
# CURRENT REALITY (2026-09-09): lw-c3 (.108) is the SOLE control-plane server;
# lw-c1 (.107) and lw-c2 (.240) are agents. (The previous version of this file
# listed lw-c1 as the server — that was STALE and would have flipped the control
# plane if applied. Fixed.)
#
# HA PROMOTION (maintenance window — see README-HA.md): move lw-c1 and lw-c2 from
# [k3s_agents] into [k3s_servers], supply -e k3s_token=... (+ k3s_datastore_endpoint),
# and re-run. Servers roll one at a time. Verify VIP failover by draining before
# trusting it. Do NOT do this casually — it reinstalls k3s on the promoted nodes.

[k3s_servers]
192.168.0.108 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c3

[k3s_agents]
192.168.0.107 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c1
192.168.0.240 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c2

