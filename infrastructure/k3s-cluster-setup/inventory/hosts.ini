# HA apply 2026-09-09: all three promoted to control-plane servers on the external
# Postgres datastore. Order matters — c3 (the pre-existing sole CP) is LAST so c1+c2
# are already serving before it reconfigures. serial:1 rolls one at a time.

[k3s_servers]
192.168.0.107 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c1
192.168.0.240 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c2
192.168.0.108 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519   # lw-c3 (LAST)

[k3s_agents]
# lw-amd: Lenovo IdeaPad C340 (Ryzen APU, Radeon Vega gfx902, 2G UMA VRAM), WiFi-only
# (wlp2s0, no ethernet port). Plain AGENT, never a server. Soft taint keeps general
# workloads on c1-c3 unless they opt in; GPU pods select homelab/gpu=amd-vega and
# request squat.ai/amdgpu (shared, helm charts/gpu-share).
# IP must stay stable -> keep the router DHCP reservation for e4:aa:ea:e8:98:3b.
192.168.0.118 ansible_user=kamil ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=/home/kamil-rybacki/.ssh/id_ed25519 k3s_agent_extra_args="--node-ip=192.168.0.118 --flannel-iface=wlp2s0 --node-label=homelab/gpu=amd-vega --node-label=homelab/gpu-arch=gfx902 --node-label=homelab/network=wifi --node-taint=homelab/gpu-node=true:PreferNoSchedule"   # lw-amd
