# Every homelab host that should see the shared lw-nas bulk-storage share.
# lw-main is the deploy box itself, so it uses a local connection.
[storage_clients]
lw-main ansible_connection=local
lw-c1   ansible_host=192.168.0.107 ansible_user=kamil
lw-c2   ansible_host=192.168.0.240 ansible_user=kamil
lw-c3   ansible_host=192.168.0.108 ansible_user=kamil
lw-amd  ansible_host=192.168.0.118 ansible_user=kamil
lw-db   ansible_host=192.168.0.115 ansible_user=kamil
lw-pi   ansible_host=192.168.0.109 ansible_user=kamil

[storage_clients:vars]
ansible_python_interpreter=/usr/bin/python3
