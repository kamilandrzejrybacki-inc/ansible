---
# vault-mcp-token in namespace mcp-servers. hashicorp-vault/mcp-bridge is RESTRICTED (a Vault
# token), so only this infra-role task delivers it. Every other mcp-servers Secret comes from
# ESO (argocd-apps/secrets/eso/mcp-servers).

- name: Load mcp-bridges secrets bundle from Vault
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/vault-integration/load.yml"
  vars:
    vault_refs:
      vault_token: "hashicorp-vault/mcp-bridge#token"

- name: Resolve vault-mcp token
  ansible.builtin.set_fact:
    _vault_mcp_token: "{{ vault_mcp_token | default(_vault_secrets.vault_token) | default('') }}"
  no_log: true

- name: Assert vault-mcp token is present
  ansible.builtin.assert:
    that: _vault_mcp_token | length > 0
    fail_msg: "hashicorp-vault/mcp-bridge#token missing in Vault (or pass --extra-vars vault_mcp_token=...)"

- name: Create vault-mcp-token secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_local_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-mcp-token
        namespace: mcp-servers
      type: Opaque
      stringData:
        token: "{{ _vault_mcp_token }}"
  no_log: true
