# ArgoCD Application for the ESO-delivered secrets (argocd-apps/secrets/eso/**).
#
# STAGED — do NOT copy into argocd-apps/apps/ until the cutover step: with creationPolicy: Owner
# the ExternalSecrets would contend with the sops-operator / ansible k8s-secrets role for the
# same Secret names. At cutover: `git mv` this to argocd-apps/apps/eso-secrets.yaml in the SAME
# commit that removes the superseded sops files from secrets/bootstrap (and disables the ansible
# k8s-secrets in-cluster tasks), so ownership flips atomically per Secret.
#
# Prerequisite: `vault-eso-approle` Secret present in every namespace (vault-setup role,
# --tags taxonomy-policies) — otherwise every SecretStore is NotReady.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kamilandrzejrybacki-inc/argocd-apps.git
    targetRevision: main
    path: secrets/eso
    directory:
      recurse: true
      include: '{secretstore.yaml,es-*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
