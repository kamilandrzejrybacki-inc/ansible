# Vault taxonomy migration map — secret/homelab/<old>#<field>  ->  secret/homelab/v2/<issuer>/<credential>#<field>
#
# Source of truth for build.py, the gate, and the delete step. See ../VAULT-TAXONOMY.md for the rules.
#
# Entry forms:
#   "<old>#<field>": "<issuer>/<cred>#<field>"          move (default seed = Vault's current value)
#   "<old>#<field>": {dst: "...", seed: {sops: <file>, key: <k>}}   seed from the LIVE sops copy (drifted secrets)
#   "<old>#<field>": evict                               non-secret config -> helm values / ansible vars (NOT written to Vault)
#   "<old>#<field>": delete                              dead; never written; revoke upstream where noted
#   "<old>": delete                                      whole secret is dead
#
# Several sources may map to one destination (merge). build.py refuses to apply if merged sources
# carry DIFFERENT values for the same field — a conflict is a decision, not a silent overwrite.
staging_prefix: homelab/v2
restricted_issuers: [wireguard, authelia, pihole, cloudflare, machines, k3s, hashicorp-vault]
restricted_paths: [postgres/k3s-datastore]

