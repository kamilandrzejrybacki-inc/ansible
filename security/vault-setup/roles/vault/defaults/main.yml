---
# HashiCorp Vault install directory
vault_install_dir: "/opt/vault"

# Docker image
vault_image: "hashicorp/vault:1.17"

# Vault listener port — bind to all interfaces so Caddy can reach it from Docker
vault_port: 8200
vault_bind_address: "0.0.0.0"

# Vault storage backend: "file" (simple) or "raft" (HA-capable)
vault_storage_backend: "file"

# Auto-unseal: store unseal keys and root token on first init
# Set to false for manual unseal (more secure, but requires operator)
vault_auto_unseal: true
vault_keys_file: "/opt/vault/init-keys.json"
# Operator token used by standalone --tags runs (see tasks/resolve-token.yml).
# Written by `vault login -method=oidc` and renewed 3-hourly by a systemd user
# timer. The init-keys file above no longer carries root_token — it was trimmed
# to unseal keys on 2026-09-16 — so this is the normal source now.
# NOTE this path is slurped from the MANAGED host while the default is computed
# from the CONTROLLER's $HOME — fine for the localhost/lw-main case this role is
# actually run in (Play 3 adds localhost with connection: local). For a genuinely
# remote Vault host, pass -e vault_admin_token=<token> instead of relying on it.
# ansible_env is deliberately NOT used: Play 3 runs with become: true, so it
# would resolve to root's home rather than the operator's.
vault_operator_token_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.vault-token"

# KV v2 secrets engine mount path
vault_kv_mount: "secret"

# Ansible policy name
vault_ansible_policy: "ansible-automation"

# Taxonomy restricted tier (VAULT-TAXONOMY.md rule 11): issuers/paths that the `agents` and
# `k8s` policies are explicitly DENIED — keys that own the network, the hosts, or Vault itself.
# Whole issuers only where nothing under them is a per-app credential; Authelia (OIDC client
# secrets) and Vault (metrics token) mint things ESO must deliver, so only their power keys
# are restricted, by path.
vault_restricted_issuers: [wireguard, pihole, cloudflare, machines, k3s]
vault_restricted_paths: ["postgres/k3s-datastore", "authelia/admin", "hashicorp-vault/root", "hashicorp-vault/unseal", "hashicorp-vault/mcp-bridge", "forgejo/admin"]

# Narrow carve-outs INSIDE a restricted issuer, for single credentials that are
# demonstrably low-privilege. Rendered AFTER the deny rules; in a Vault ACL an
# exact path beats a glob, so the rest of the issuer stays denied.
# - cloudflare/workers-ai (2026-09-18): a Workers-AI-scoped token consumed by the
#   LiteLLM gateway. It cannot read billing or touch DNS/tunnels/zones — verified,
#   /user/tokens/verify returns 401 for it. The `cloudflare` issuer stays restricted
#   because the EDGE token under it does control DNS, tunnels and zones.
vault_restricted_exceptions: ["cloudflare/workers-ai"]

# Namespaces whose Secrets are delivered by ESO (source: migrate/eso/manifest.yaml). Each gets a
# `vault-eso-approle` bootstrap Secret from the taxonomy-policies / eso-bootstrap tag.
vault_eso_namespaces: [cellarette, dbt, feedcord, forgejo-runner, github-runners, glitchtip, gnhf, grafana, hermes, litellm, mcp-servers, monitoring, n8n, ntfy, openviking, paperless, shared-redis, silverbullet, tauto, teammates, termix, yaikes-etl]

# Health-check settings
vault_health_check_retries: 12
vault_health_check_delay: 5

# Public URL used by clients to fetch CA / CRL from the workspace PKI mount.
# Defaults to the hashi-vault subdomain of the homelab's saved domain (set on the
# controller from ~/.homelab-setup-vars.yml via Play 1 of setup.yml).
workspace_pki_public_url: "https://hashi-vault.{{ saved_domain }}"
