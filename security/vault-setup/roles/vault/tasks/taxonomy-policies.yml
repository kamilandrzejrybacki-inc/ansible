---
# Taxonomy role policies + AppRoles (VAULT-TAXONOMY.md rule 11/12).
# Same mechanism as ansible-policy: render HCL -> docker cp -> `vault policy write` inside the
# container (runs with the container's root session). Run: --tags taxonomy-policies
# Four policies: infra (rw all), agents (read minus restricted), k8s (= agents, for ESO),
# humans (admin, short TTL). AppRoles: ansible-infra -> infra, cellarette-local -> agents,
# eso -> k8s. Existing legacy policies/tokens are NOT removed here (that is the auth follow-on).

# A --tags run skips the init/unseal tasks that set vault_root_token; read it from the init keys.
- name: Taxonomy — load root token from init keys (standalone run)
  when: vault_root_token is not defined
  tags: [taxonomy-policies, eso-bootstrap]
  no_log: true
  block:
    - name: Taxonomy — slurp init keys
      ansible.builtin.slurp:
        src: "{{ vault_keys_file }}"
      register: _tax_keys
    - name: Taxonomy — set root token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_tax_keys.content | b64decode | from_json).root_token }}"

- name: Taxonomy — render policy HCL files
  ansible.builtin.template:
    src: policy-taxonomy.hcl.j2
    dest: "{{ vault_install_dir }}/policy-{{ item }}.hcl"
    mode: "0640"
  vars:
    policy_name: "homelab-{{ item }}"
    policy_role: "{{ item }}"
  loop: [infra, agents, k8s, humans]
  tags: [taxonomy-policies]

- name: Taxonomy — copy policy files into the Vault container
  ansible.builtin.shell: >
    docker cp {{ vault_install_dir }}/policy-{{ item }}.hcl vault:/tmp/policy-{{ item }}.hcl
  loop: [infra, agents, k8s, humans]
  changed_when: true
  tags: [taxonomy-policies]

- name: Taxonomy — write policies
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault policy write homelab-{{ item }} /tmp/policy-{{ item }}.hcl
  loop: [infra, agents, k8s, humans]
  register: _tax_pol
  changed_when: _tax_pol.rc == 0
  no_log: true
  tags: [taxonomy-policies]

- name: Taxonomy — ensure AppRole auth is enabled
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault auth enable approle
  register: _approle
  failed_when: _approle.rc != 0 and 'already in use' not in (_approle.stderr | default(''))
  changed_when: _approle.rc == 0
  no_log: true
  tags: [taxonomy-policies]

- name: Taxonomy — create AppRoles bound to the taxonomy policies
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault write auth/approle/role/{{ item.name }}
      token_policies="{{ item.policy }}"
      token_ttl={{ item.ttl }} token_max_ttl={{ item.max_ttl }}
      secret_id_ttl={{ item.secret_id_ttl }} secret_id_num_uses=0
  loop:
    - { name: ansible-infra,    policy: homelab-infra,  ttl: 1h,  max_ttl: 4h,  secret_id_ttl: 720h }
    - { name: cellarette-local, policy: homelab-agents, ttl: 1h,  max_ttl: 24h, secret_id_ttl: 720h }
    - { name: eso,              policy: homelab-k8s,    ttl: 1h,  max_ttl: 24h, secret_id_ttl: 720h }
  loop_control: { label: "{{ item.name }}" }
  register: _tax_roles
  changed_when: _tax_roles.rc == 0
  no_log: true
  tags: [taxonomy-policies]

- name: Taxonomy — read role IDs (secret_ids are minted per consumer at deploy time, never stored in git)
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault read -field=role_id auth/approle/role/{{ item }}/role-id
  loop: [ansible-infra, cellarette-local, eso]
  register: _tax_roleids
  changed_when: false
  no_log: true
  tags: [taxonomy-policies]

- name: Taxonomy — summary
  ansible.builtin.debug:
    msg: "{{ item.item }}: role_id={{ item.stdout }}"
  loop: "{{ _tax_roleids.results }}"
  loop_control: { label: "{{ item.item }}" }
  tags: [taxonomy-policies]

# --- ESO bootstrap: each ESO namespace gets a `vault-eso-approle` Secret (role_id + secret_id)
# that its SecretStore authenticates with. One secret_id shared across namespaces (same identity,
# same k8s policy); rotate by re-running this tag. Runs here because minting a secret_id needs the
# root session, and this host (lw-main) has kubectl.
- name: Taxonomy — read eso AppRole role_id
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault read -field=role_id auth/approle/role/eso/role-id
  register: _eso_rid
  changed_when: false
  no_log: true
  tags: [taxonomy-policies, eso-bootstrap]

- name: Taxonomy — mint an eso AppRole secret_id
  ansible.builtin.command:
    cmd: >
      docker exec -e VAULT_ADDR=http://127.0.0.1:8200
      -e VAULT_TOKEN={{ vault_root_token }}
      vault vault write -f -field=secret_id auth/approle/role/eso/secret-id
  register: _eso_sid
  changed_when: true
  no_log: true
  tags: [taxonomy-policies, eso-bootstrap]

- name: Taxonomy — create/refresh vault-eso-approle Secret in every ESO namespace
  ansible.builtin.shell: >
    kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f - >/dev/null &&
    kubectl -n {{ item }} create secret generic vault-eso-approle
    --from-literal=role_id={{ _eso_rid.stdout }} --from-literal=secret_id={{ _eso_sid.stdout }}
    --dry-run=client -o yaml | kubectl apply -f -
  loop: "{{ vault_eso_namespaces }}"
  become: false
  changed_when: true
  no_log: true
  tags: [taxonomy-policies, eso-bootstrap]
